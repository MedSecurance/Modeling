stages:
  - build

# this job is used to build the docker image from Papyrus WebApp (front and backend)
DockerImageWebApp:
  stage: build
  image: ubuntu:stable
  tags: ["ubuntu"]
  script:
    - docker build --build-arg USERNAME=${USERNAME} --build-arg PASSWORD=${PASSWORD} --build-arg WEBAPP_VERSION=${WEBAPP_VERSION} -t papyrusweb -f backend/papyrus-web-application/Dockerfile.local .

