
services:
  database:
    image: postgres:12
    env_file:
      - .env    
  papyrusweb:
    image: papyrus-web-iomt:2025.10.16${IMAGE_SUFFIX}
    build:
      context: .
      dockerfile: ./dockerfiles/Dockerfile
      args:
        USERNAME: ${GITHUB_USERNAME}
        PASSWORD: ${GITHUB_AUTH_TOKEN}              
    ports:
      - "8080:8080"
    env_file:
      - .env    
    depends_on:
      - database
      - codegenrcp
      - generateiomtapp

  codegenrcp:
    build:
      context: ../modeling-services-rcp
      dockerfile: dockerfiles/rcp/Dockerfile
    image: codegenrcp:2025.08.22${IMAGE_SUFFIX}
    ports:
      - "8083:8083"
    env_file:
      - .env    

  generateiomtapp:
    build:
      context: ../medsecuranceappgen
      dockerfile: dockerfiles/Dockerfile
    image: iomtgen:2025.08.22${IMAGE_SUFFIX}
    command: 
    ports:
      - "9000:9000"
    environment:
      APPWEB_URL: http://papyrusweb:8080

  framac-api:
    build:
      context: ../frama-c-for-arduino/install
      dockerfile: Dockerfile
    image: frama-c-api:2025.11.14${IMAGE_SUFFIX}
    ports:
      - "5000:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

