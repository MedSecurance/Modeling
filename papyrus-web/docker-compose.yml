
services:
  database:
    image: postgres:12
    env_file:
      - .env    
  papyrusweb:
    image: papyrus-web-iomt:2025.10.16${IMAGE_SUFFIX}
    build:
      context: .
      dockerfile: ./dockerfiles/Dockerfile
      args:
        USERNAME: ${GITHUB_USERNAME}
        PASSWORD: ${GITHUB_AUTH_TOKEN}              
    ports:
      - "8080:8080"
    env_file:
      - .env    
    depends_on:
      - database
      - codegenrcp
      - generateiomtapp

  codegenrcp:
    build:
      context: ../modeling-services-rcp
      dockerfile: dockerfiles/rcp/Dockerfile
      platforms:
        - linux/amd64
    image: codegenrcp:2025.08.22${IMAGE_SUFFIX}
    platform: linux/amd64
    ports:
      - "8083:8083"
    env_file:
      - .env    

  generateiomtapp:
    build:
      context: ../medsecuranceappgen
      dockerfile: dockerfiles/Dockerfile
    image: iomtgen:2025.08.22${IMAGE_SUFFIX}
    command: 
    ports:
      - "9000:9000"
    environment:
      APPWEB_URL: http://papyrusweb:8080

