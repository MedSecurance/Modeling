server.port=8080
spring.datasource.url=jdbc:postgresql://localhost:5439/papyrus-web-db
spring.datasource.username=dbuser
spring.datasource.password=dbpwd

spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER

spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.liquibase.change-log=classpath:db/changelog/papyrus-web.db.changelog.xml
spring.servlet.multipart.max-request-size=20MB

sirius.web.enabled=*
sirius.components.cors.allowedOriginPatterns=*
sirius.components.cors.allowedCredentials=true


# REACT FRONT END properties

react.app.modelServiceUrl=${MODEL_SERVICE_URL:http://localhost:8083}
react.app.iomtGeneratorUrl=${IOMT_GENERATOR_URL:http://localhost:9000}