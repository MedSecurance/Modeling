server.port=8080
spring.datasource.url=jdbc:postgresql://localhost:5439/papyrus-web-db
spring.datasource.username=dbuser
spring.datasource.password=dbpwd

spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER

spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.liquibase.change-log=classpath:db/changelog/papyrus-web.db.changelog.xml
spring.servlet.multipart.max-request-size=20MB

sirius.web.enabled=*
sirius.components.cors.allowedOriginPatterns=*
sirius.components.cors.allowedCredentials=true


# REACT FRONT END properties

react.app.modelServiceUrl=${MODEL_SERVICE_URL:http://localhost:8083}
react.app.createRoomServerUrl=${CREATE_ROOM_SERVER_URL:https://matrix-synapse.deeplab.fr}
react.app.elementUrl=${ELEMENT_URL:http://localhost:8085}
react.app.encoderUrl=${ENCODER_URL:http://localhost:8001}
react.app.generatorUrl=${GENERATOR_URL:http://localhost:8000}
react.app.defaultLLMModel=${DEFAULT_LLM_MODEL:}
react.app.defaultLLMUrl=${DEFAULT_LLM_URL:https://api.openai.com/v1/chat/completions}
react.app.defaultPrompt=${DEFAULT_PROMPT:You are an UML modeler. You answer using PlantUML in the output.}
react.app.defaultMsg=${DEFAULT_MSG:}
react.app.serverOptions=${SERVER_OPTIONS:https://api.openai.com/v1/chat/completions,http://localhost:8000/uml_chat_rag/,http://localhost:8000/ob_chat_rag/}
react.app.iomtGeneratorUrl=${IOMT_GENERATOR_URL:http://localhost:9000}